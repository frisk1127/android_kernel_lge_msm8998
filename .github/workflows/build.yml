name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      susfs:
        description: "SUSFS mode: on/off"
        required: false
        default: "on"
      localversion:
        description: "Kernel LOCALVERSION (e.g. -Iseri_Nina)"
        required: false
        default: "-Iseri_Nina"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libssl-dev libelf-dev \
            python3 python3-pip git wget curl \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang lld llvm \
            ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 10G
          ccache --set-config=sloppiness=time_macros,file_macro,include_file_ctime,include_file_mtime
          ccache --set-config=compiler_check=content
          ccache --set-config=compression=true
          ccache -z

      - name: Build
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_LOGFILE="$GITHUB_WORKSPACE/ccache.log"
          export CC="ccache clang"
          export CXX="ccache clang++"
          chmod +x ./build.sh
          ./build.sh --susfs "${{ inputs.susfs }}" --localversion "${{ inputs.localversion }}"

      - name: Extract First Error (if any)
        if: ${{ always() }}
        run: |
          set +e
          LOG="$(ls -1t logs/build-*.log 2>/dev/null | head -n 1)"
          if [ -z "$LOG" ]; then
            echo "No build log found under logs/."
            exit 0
          fi
          echo "Using log: $LOG"
          echo "---- first matches ----"
          rg -n -m 50 "(^|\\s)(error:|fatal error:|undefined reference|ld: |collect2:)" "$LOG" || true
          echo "---- tail ----"
          tail -n 120 "$LOG" || true

      - name: Ccache Stats
        if: ${{ always() }}
        run: |
          echo "Ccache 统计:"
          ccache -sv

      - name: Upload Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            logs/build-*.log
            ccache.log
            out/.config
